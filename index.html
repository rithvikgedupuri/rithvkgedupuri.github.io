<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Portal</title>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        header {
            padding: 40px 20px;
            background: linear-gradient(135deg, #6200ee, #03dac6);
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { margin: 0; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e24;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #03dac6;
        }
        .card h3 { margin-top: 0; color: #03dac6; }
        .btn {
            display: inline-block;
            background-color: #6200ee;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:hover { background-color: #3700b3; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 Kid's Coding Arcade </h1>
        <p>Play the games, then open up GitHub to change how they work!</p>
    </header>

    <div class="grid">
        <!-- Game 1 -->
        <div class="card">
            <h3>Clicker Mania</h3>
            <p>Score points by clicking as fast as you can before time runs out!</p>
